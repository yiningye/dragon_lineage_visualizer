<html>
<head>
  <title>Dragon Lineage Builder</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    
    .link {
      fill: none;
      stroke: #555;
      stroke-opacity: 0.4;
      stroke-width: 1.5px;
    }
    .node circle {
      fill: #999;
    }
    .node text {
      font: 12px sans-serif;
    }

    #tree-container {
      flex: 1 1 400px;
      width: 100%;
      height: 100%;
      overflow: auto;
      border: 1px solid #ccc;
    }

    body {
      font-family: "Segoe UI", sans-serif;
      background: #f4f4f9;
      height: calc(100vh - 50px);
      margin: 0;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  
    h1 {
      color: #2c3e50;
      margin-bottom: 1rem;
    }
  
    form {
      background-color: #ffffff;
      padding: 1.5rem 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      align-items: center;
    }
  
    input[type="text"],
    input[type="number"] {
      padding: 0.5rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      width: 200px;
      transition: border-color 0.2s;
    }
  
    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: #3498db;
      outline: none;
    }
  
    input[type="checkbox"] {
      margin-left: 1rem;
      transform: scale(1.2);
    }
  
    label {
      font-size: 0.95rem;
      color: #333;
      margin-right: 1rem;
    }
  
    button {
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }
  
    button:hover {
      background-color: #2980b9;
    }
  
    @media (max-width: 600px) {
      form {
        flex-direction: column;
        align-items: stretch;
      }
  
      input[type="text"],
      input[type="number"] {
        width: 100%;
      }
  
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h1>Dragon Lineage Visualizer</h1>
  <form action="">
    <input type="text" id="dragonId" placeholder="Enter Dragon ID">
    <input type="number" id="maxGen" placeholder="Max Generations (1-4)" min="1" max="4" style="width: 300px;" >
    <input type="checkbox" id="excludeExalted">
    <label for="excludeExalted">Exclude Exalted?</label><br>

    <button id="fetchLineage" type="button">Fetch Lineage</button>
  </form>
  
  <div id="tree-container"></div>

  <script>
    console.log("Script loaded");

    document.getElementById('fetchLineage').addEventListener('click', async () => {
      const id = document.getElementById('dragonId').value;
      console.log("Script loaded", id);

      const maxGen = parseInt(document.getElementById('maxGen').value, 10);
      console.log("Script loaded", maxGen);

      const excludeExalted = document.getElementById('excludeExalted').checked;
      console.log("Script loaded", excludeExalted);


      if (!id || isNaN(maxGen)) {
        alert("Please fill out both fields!");
        return;
      }
      
      //Debug from static json
      /*
      fetch('/static/data/dragon_tree.json')
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.json();
      })
      .then(data => {
        console.log("hello")
        renderTree(data);
        console.log(data);
      })
      .catch(error => {
        console.error('Error fetching JSON:', error);
      }); 
      */
      // Fetch the JSON
      
      try {
        const response = await fetch(`/api/lineage?dragonId=${id}&maxGen=${maxGen}&excludeExalted=${excludeExalted}`);
        const lineageData = await response.json();
        console.log(JSON.stringify(lineageData, null, 2));
        
        renderTree(lineageData); // Then render it
      } catch (e) {
        console.error("Failed to fetch lineage", e);
      }
        
    });

    function renderTree(data) {
      console.log("rendering");

      const container = document.getElementById('tree-container');
      container.innerHTML = ""; // Clear previous content


      const root = d3.hierarchy(data);
      const treeLayout = d3.tree().nodeSize([150, 100]);
      treeLayout(root);

      const largestXofTree = Math.max(...root.descendants().map(d => d.x));
      const smallestXofTree = Math.min(...root.descendants().map(d => d.x));

      const heightTree = Math.max(...root.descendants().map(d => d.y)) + 200;

      

      // Compute bounds
      const nodes = root.descendants();
      const minX = d3.min(nodes, d => d.x);
      const maxX = d3.max(nodes, d => d.x);

      const svgWidth = container.clientWidth;
      const svgHeight = container.clientHeight;

      const allX = root.descendants().map(d => d.x);
      console.log("All X values:", allX);
      console.log("Max X:", Math.max(...allX));
      console.log("Min X:", Math.min(...allX));
      const svg = d3.select("#tree-container")
        .append("svg")
        .attr("width", Math.abs(largestXofTree)+Math.abs(smallestXofTree)+400)
        .attr("height", heightTree)
      const g = svg.append("g")
        .attr("transform", `translate(${Math.abs(smallestXofTree)+200}, 50)`);
      
        

      // Draw links
      g.selectAll(".link")
    .data(root.links())
    .join("path")
    .attr("class", "link")
    .attr("d", d => `
      M${d.source.x},${d.source.y}
      V${d.target.y}
      H${d.target.x}`);

  // Draw nodes
    const node = g.selectAll(".node")
      .data(root.descendants())
      .join("g")
      .attr("class", "node")
      .attr("transform", d => `translate(${d.x},${d.y})`);

    // Example dragon image (replace with actual image logic as needed)
    node.append("image")
      .attr("xlink:href", d => `https://www1.flightrising.com/rendern/portraits/${d.data.portrait_id}/${d.data.dragon_id}p.png`)
      .attr("x", -20)
      .attr("y", -40)
      .attr("width", 40)
      .attr("height", 40);

    // Name
    node.append("text")
      .attr("dy", "1.5em")
      .attr("text-anchor", "middle")
      .text(d => d.data.name || "Unnamed");

    // Metadata below
    node.append("text")
      .attr("dy", "2.7em")
      .attr("text-anchor", "middle")
      .style("font-size", "10px")
      .style("fill", "#666")
      .text(d => `${d.data.gender} | ${d.data.flight} Flight`);

    // Optional styling based on gender
    node.selectAll("image")
      .attr("stroke", d => d.data.gender === "M" ? "#4a90e2" :
                          d.data.gender === "F" ? "#e94e77" : "#aaa")
      .attr("stroke-width", 2)
      .attr("rx", 4);  // rounded corners
  }
    
  </script>
</body>
</html>
