<html>
<head>
  <title>Dragon Lineage Builder</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    svg {
      border: 1px solid #ccc;
      width: 100%;
      height: 100%;
    }
    .link {
      fill: none;
      stroke: #555;
      stroke-opacity: 0.4;
      stroke-width: 1.5px;
    }
    .node circle {
      fill: #999;
    }
    .node text {
      font: 12px sans-serif;
    }
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  
    h1 {
      color: #2c3e50;
      margin-bottom: 1rem;
    }
  
    form {
      background-color: #ffffff;
      padding: 1.5rem 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      align-items: center;
    }
  
    input[type="text"],
    input[type="number"] {
      padding: 0.5rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      width: 200px;
      transition: border-color 0.2s;
    }
  
    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: #3498db;
      outline: none;
    }
  
    input[type="checkbox"] {
      margin-left: 1rem;
      transform: scale(1.2);
    }
  
    label {
      font-size: 0.95rem;
      color: #333;
      margin-right: 1rem;
    }
  
    button {
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }
  
    button:hover {
      background-color: #2980b9;
    }
  
    @media (max-width: 600px) {
      form {
        flex-direction: column;
        align-items: stretch;
      }
  
      input[type="text"],
      input[type="number"] {
        width: 100%;
      }
  
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h1>Dragon Lineage Visualizer</h1>
  <form action="">
    <input type="text" id="dragonId" placeholder="Enter Dragon ID">
    <input type="number" id="maxGen" placeholder="Max Generations (1-4)" min="1" max="4" style="width: 300px;" >
    <input type="checkbox" id="excludeExalted">
    <label for="excludeExalted">Exclude Exalted?</label><br>

    <button id="fetchLineage" type="button">Fetch Lineage</button>
  </form>
  
  <div id="tree-container"></div>

  <script>
    console.log("Script loaded");

    document.getElementById('fetchLineage').addEventListener('click', async () => {
      const id = document.getElementById('dragonId').value;
      console.log("Script loaded", id);

      const maxGen = parseInt(document.getElementById('maxGen').value, 10);
      console.log("Script loaded", maxGen);

      const excludeExalted = document.getElementById('excludeExalted').checked;
      console.log("Script loaded", excludeExalted);


      if (!id || isNaN(maxGen)) {
        alert("Please fill out both fields!");
        return;
      }

      // Fetch the JSON
      try {
        const response = await fetch(`/api/lineage?dragonId=${id}&maxGen=${maxGen}&excludeExalted=${excludeExalted}`);
        const lineageData = await response.json();
        console.log(JSON.stringify(lineageData, null, 2));

        renderTree(lineageData); // Then render it
      } catch (e) {
        console.error("Failed to fetch lineage", e);
      }
    });

    function renderTree(data) {
      console.log("rendering");

      const container = document.getElementById('tree-container');
      container.innerHTML = ""; // Clear previous content

      const svg = d3.select("#tree-container")
        .append("svg")
        .attr("width", "100%")
        .attr("height", "100%");

      const g = svg.append("g").attr("transform", "translate(100,100)");

      const root = d3.hierarchy(data);
      const treeLayout = d3.tree().nodeSize([50, 150]);
      treeLayout(root);

      // Draw links
      g.selectAll(".link")
        .data(root.links())
        .join("path")
        .attr("class", "link")
        .attr("d", d3.linkHorizontal()
          .x(d => d.y)
          .y(d => d.x)
        );

      // Draw nodes
      const node = g.selectAll(".node")
        .data(root.descendants())
        .join("g")
        .attr("class", "node")
        .attr("transform", d => `translate(${d.y},${d.x})`);

      node.append("circle")
        .attr("r", 10);

      node.append("text")
        .attr("dy", "0.31em")
        .attr("x", d => d.children ? -15 : 15)
        .attr("text-anchor", d => d.children ? "end" : "start")
        .text(d => d.data.name);
    }
  </script>
</body>
</html>
