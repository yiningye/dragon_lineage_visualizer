<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dragon Lineage Viewer</title>
    <style>
        body {
            font-family: sans-serif;
        }
        .node circle {
            fill: #69b3a2;
            stroke: #555;
            stroke-width: 2px;
        }
        .node text {
            font-size: 12px;
            fill: #333;
        }
        .link {
            fill: none;
            stroke: #aaa;
            stroke-width: 2px;
        }
        svg {
            width: 100%;
            height: 100vh;
            overflow: visible;
        }
    </style>
</head>
<body>
    <h2>Dragon Lineage Viewer</h2>
    <svg></svg>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        // Example dragon lineage data
        const data = {
  "id": 31833616,
  "name": "Corthyra",
  "gender": "Male",
  "flight": "Arcane",
  "generation": 1,
  "descendants_num": 0,
  "exalted": false,
  "children": [
    {
      "id": 61929820,
      "name": "Ysolde",
      "gender": "Female",
      "flight": "Arcane",
      "generation": 2,
      "descendants_num": 0,
      "exalted": false,
      "children": []
    },
    {
      "id": 73172442,
      "name": "Faraday",
      "gender": "Female",
      "flight": "Arcane",
      "generation": 2,
      "descendants_num": 0,
      "exalted": false,
      "children": []
    },
    {
      "id": 76008781,
      "name": "Unnamed",
      "gender": "Male",
      "flight": "Wind",
      "generation": 2,
      "descendants_num": 0,
      "exalted": false,
      "children": []
    }
  ]
};

        const svg = d3.select("svg");
        const g = svg.append("g"); // We'll move the tree inside this <g> group

        const root = d3.hierarchy(data);
        const treeLayout = d3.tree().nodeSize([50, 150]); // control spacing: [vertical, horizontal]

        treeLayout(root);

        // Shift the tree down and right a bit
        g.attr("transform", "translate(100,100)");

        // Draw links
        g.selectAll(".link")
            .data(root.links())
            .join("path")
            .attr("class", "link")
            .attr("d", d3.linkHorizontal()
                .x(d => d.y)
                .y(d => d.x)
            );

        // Draw nodes
        const node = g.selectAll(".node")
            .data(root.descendants())
            .join("g")
            .attr("class", "node")
            .attr("transform", d => `translate(${d.y},${d.x})`);

        node.append("circle")
            .attr("r", 10);

        node.append("text")
            .attr("dy", "0.31em")
            .attr("x", d => d.children ? -15 : 15)
            .attr("text-anchor", d => d.children ? "end" : "start")
            .text(d => d.data.name);
    </script>
</body>
</html>
